name: Deploy Server to Render

on:
  push:
    branches:
      - master
    paths:
      - "server/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-server.yaml"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: server_env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Render Environment Variables
        run: |
          curl -X PUT "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '[
              {"key": "PORT", "value": "10000"}
            ]' \
            --fail \
            --silent \
            --show-error

      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.SERVER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail \
            --silent \
            --show-error

      - name: Deployment Triggered
        run: |
          echo " == Environment variables updated == "
          echo " == Render deployment triggered successfully == "
