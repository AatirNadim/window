name: Deploy UI to Netlify

on:
  push:
    branches:
      - master
    paths:
      - "window-ui/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-ui.yaml"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ui_env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Netlify Deploy
        run: |
          curl -X POST "${{ secrets.NETLIFY_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail \
            --silent \
            --show-error

      - name: Deployment Triggered
        run: |
          echo " == Environment variables updated == "
          echo " == Netlify deployment triggered successfully == "
