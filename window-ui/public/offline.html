<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#176b47" />
    <title>Offline — Window</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4f6f4; color: #18372b; margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { max-width: 30rem; padding: 2rem; }
      h1 { font-size: 2rem; }
      p { line-height: 1.6; }
      button { background: #176b47; color: white; border: 0; border-radius: .5rem; padding: .75rem 1rem; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Window needs an internet connection to join rooms and connect with other devices. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
